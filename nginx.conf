server {
  listen 80;
  root /usr/share/nginx/html;
  server_tokens off;

  # nginx's default mime.types doesn't know .webmanifest.
  include mime.types;
  types {
    application/manifest+json webmanifest;
  }

  gzip on;
  gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

  # Hashed build output: the name changes whenever the content does.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Everything else (page, service worker, manifest, Clips) is revalidated so updates reach installed apps.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ =404;
  }
}
